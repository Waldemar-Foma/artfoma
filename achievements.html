<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>artfoma // достижения</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="achievements-page">

<div class="dot-pattern"></div>
<div class="geo-primitive cross-brut"></div>
<div class="geo-primitive circle-blunt"></div>

<main class="main-content visible" id="mainContent">

    <section class="section-wrapper" style="padding-top: 3rem;">
        <div class="section-container">
            <div class="section-header">
                <h2 class="section-title">// достижения</h2>
            </div>

            <p class="achievements-intro">
                Все дипломы, сертификаты и награды. PDF открываются прямо на странице, PNG — в увеличенном виде по клику.
            </p>

            <div class="achievements-filters" id="achievementsFilters">
                <button class="filter-btn active" data-filter="all">все</button>
                <button class="filter-btn" data-filter="pdf">PDF</button>
                <button class="filter-btn" data-filter="image">PNG / JPG</button>
            </div>

            <div class="achievements-grid" id="achievementsGrid">
                <div class="achievements-loading">Загрузка достижений...</div>
            </div>

            <div class="center-btn" style="margin-top: 3rem;">
                <a href="index.html" class="brutal-btn secondary">← на главную</a>
            </div>
        </div>
    </section>

    <footer class="brutal-footer">
        <div class="footer-content">
            <span class="footer-mono">artfoma © 2026</span>
            <span class="footer-mono">studio@artfoma.ru</span>
            <div class="social-icons">
                <span class="social-link" onclick="window.open('https://t.me/art_f0ma','_blank')">telegram</span>
            </div>
        </div>
    </footer>
</main>

<!-- Модалка для просмотра PNG -->
<div class="modal-overlay" id="imageModal" style="display:none;">
    <div class="modal-content" style="max-width: 95vw;">
        <div class="modal-header">
            <span class="modal-title" id="imageModalTitle">// просмотр</span>
            <button class="modal-close" id="imageModalClose">&times;</button>
        </div>
        <div class="modal-body" style="text-align:center;">
            <img id="imageModalImg" src="" alt="" style="max-width:100%;max-height:75vh;border:3px solid var(--black);">
        </div>
    </div>
</div>

<script src="js/achievements.js"></script>
</body>
</html>
